name: PantryShare Skia Storybook

on:
  push:
    branches: [yclmir]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check package bundle
        run: git diff --exit-code -- dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    if: vars.PUBLISH_PANTRYSHARE_STORYBOOK == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@v4
