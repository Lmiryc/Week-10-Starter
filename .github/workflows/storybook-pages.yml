name: Verify PantryShare Skia Storybook

on:
  push:
    branches: [yclmir]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check package bundle
        run: git diff --exit-code -- dist
